<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret G</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Funny Popup -->
  <div id="popup" class="popup">
    <div class="popup-box">
      <h2>👀 Hold up...</h2>
      <p class="question">Is your job done?</p>
      <p class="sub">Be honest.</p>
      <div class="popup-buttons">
        <button onclick="answerYes()">Yes, I'm free!</button>
        <button class="no" onclick="answerNo()">No, but I'm still playing</button>
      </div>
      <p class="credit">Made by Leigh</p>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="hidden">
    <div class="header">
      <h1>Tetris</h1>
      <p class="tagline">Quick break? Your manager won't mind... probably.</p>
    </div>

    <!-- Controls bar -->
    <div class="controls-top">
      <div class="control-item"><kbd>←</kbd><kbd>→</kbd> Move</div>
      <div class="control-item"><kbd>↑</kbd> Rotate</div>
      <div class="control-item"><kbd>↓</kbd> Soft Drop</div>
      <div class="control-item"><kbd>Space</kbd> Hard Drop</div>
      <div class="control-item"><kbd>C</kbd> Hold</div>
      <div class="control-item"><kbd>P</kbd> Pause</div>
    </div>

    <div class="game-wrapper">
      <!-- Left Panel: HOLD -->
      <div class="side-panel">
        <div class="panel-box">
          <div class="panel-title">HOLD</div>
          <canvas id="hold" width="120" height="120"></canvas>
        </div>

        <div class="stats-box">
          <div class="stat">
            <span class="stat-label">SCORE</span>
            <span id="score" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">LEVEL</span>
            <span id="level" class="stat-value">1</span>
          </div>
          <div class="stat">
            <span class="stat-label">LINES</span>
            <span id="lines" class="stat-value">0</span>
          </div>
        </div>
      </div>

      <!-- Main Board -->
      <div class="board-frame">
        <canvas id="tetris" width="300" height="600"></canvas>
      </div>

      <!-- Right Panel: NEXT -->
      <div class="side-panel">
        <div class="panel-box">
          <div class="panel-title">NEXT</div>
          <canvas id="next" width="120" height="120"></canvas>
        </div>

        <button id="restart-btn" onclick="restartGame()">RESTART</button>
      </div>
    </div>

    <div id="game-over" class="game-over hidden">
      <h2>Game Over</h2>
      <p>Final Score: <span id="final-score">0</span></p>
      <button onclick="restartGame()">Play Again</button>
    </div>

    <footer>
      Made with ❤️ by <strong>Leigh</strong> • 
      <a href="https://www.paypal.com/paypalme/LeighNCR" target="_blank">Buy me a coffee ☕</a>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
